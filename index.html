<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGC-Fin</title>
    <!-- Script oficial da API de Login do Google -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <div style="text-align: center; margin-top: 50px;">
        <h1>MGC-Fin - Controle Financeiro</h1>
        <p>Faça login com sua conta do Google para continuar</p>

        <!-- Botão e configuração de Login do Google -->
        <div id="g_id_onload"
             data-client_id="586477330006-f9hni1att0h5df2gsiqohasqqo0o2us5.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>

        <div class="g_id_signin" 
             data-type="standard" 
             data-shape="rectangular" 
             data-theme="outline" 
             data-text="sign_in_with" 
             data-size="large" 
             data-logo_alignment="left">
        </div>
    </div>

    <script>
        function handleCredentialResponse(response) {
            console.log="Encoded JWT ID token: " + response.credential;
            
            // Aqui você pode decodificar o token ou redirecionar o usuário após o login
            alert("Login realizado com sucesso!");
            
            // Exemplo: se quiser salvar o token e avançar na aplicação
            // localStorage.setItem("google_token", response.credential);
            // window.location.href = "dashboard.html";
        }
    </script>
</body>
</html>
