<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGC - Gerenciador Financeiro Pessoal</title>
<style>
:root{
  --paper:#FAF6EC; --ink:#221E17; --sub:#7A7264; --line:#DCD3BE;
  --stamp:#AE3A2C; --cash:#33553B; --card:#FFFDF9; --piggy:#E68A00;
  --cat0:#2F8F8B;--cat1:#B5628A;--cat2:#6B7C93;--cat3:#9A7550;--cat4:#4A8DB5;--cat5:#6E9460;--cat6:#B58A3C;--cat7:#8272B0;
  --tag0:#D9730D;--tag1:#A67C00;--tag2:#2E8B57;--tag3:#2F6FB5;--tag4:#4B4FA8;--tag5:#8A4FB0;
}
body{
  margin:0; padding:12px; background:var(--paper); color:var(--ink);
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",monospace;}
.wrap{max-width:480px;margin:0 auto;padding-bottom:60px;}

/* Tela de Login por Senha */
#lockScreen{
  position:fixed; inset:0; background:var(--paper); z-index:999;
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center;
}
#lockScreen h2{font-size:22px; margin-bottom:8px; color:var(--ink);}
#lockScreen p{font-size:13px; color:var(--sub); margin-bottom:20px;}
.lock-input{
  width:100%; max-width:280px; padding:12px; border:1px solid var(--line); border-radius:8px;
