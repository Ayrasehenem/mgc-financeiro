<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGC Financeiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-center items-center">

    <div id="login-screen" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md mx-4 border border-slate-100 hidden">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-amber-100 text-amber-600 rounded-full text-2xl mb-3 shadow-inner">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900">MGC Financeiro</h1>
            <p class="text-slate-500 text-sm mt-1">Digite a senha de acesso para continuar</p>
        </div>

        <form id="login-form" onsubmit="fazerLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Senha de Acesso</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <i class="fa-solid fa-key"></i>
                    </span>
                    <input type="password" id="senha-input" placeholder="Digite a senha..." required
                        class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition-all text-sm">
                </div>
            </div>

            <div id="login-error" class="text-red-500 text-xs text-center font-medium hidden">
                Senha incorreta. Tente novamente.
            </div>

            <button type="submit" id="btn-entrar"
                class="w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-amber-600/20 flex items-center justify-center gap-2">
                <span>Entrar no Sistema</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </div>

    <div id="app-screen" class="w-full max-w-4xl mx-auto p-4 md:p-6 hidden">
        <header class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 mb-6 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center font-bold">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 text-lg">MGC Financeiro</h1>
                    <p class="text-xs text-slate-500">Sistema de Lançamentos</p>
                </div>
            </div>
            <button onclick="fazerLogout()" class="text-slate-400 hover:text-red-600 text-sm font-medium transition-colors flex items-center gap-1 bg-slate-50 hover:bg-red-50 px-3 py-2 rounded-xl">
                <i class="fa-solid fa-right-from-bracket"></i> Sair
            </button>
        </header>

        <!-- Container principal do seu sistema de lançamentos -->
        <main class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
            <h2 class="text-lg font-bold text-slate-800 mb-4"><i class="fa-solid fa-plus-circle text-amber-600 mr-2"></i>Novo Lançamento</h2>
            
            <form id="lancamento-form" onsubmit="enviarLancamento(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Tipo</label>
                        <select id="tipo" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
                            <option value="Entrada">Entrada</option>
                            <option value="Saída">Saída</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Valor (R$)</label>
                        <input type="number" step="0.01" id="valor" required placeholder="0,00" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Descrição</label>
                    <input type="text" id="descricao" required placeholder="Ex: Pagamento de fornecedor" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
                </div>

                <button type="submit" id="btn-enviar" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 rounded-xl transition-all shadow-md">
                    Salvar Lançamento
                </button>
            </form>
        </main>
    </div>

    <script>
        // COLE AQUI O SEU LINK WEB APP DO APPS SCRIPT
        const WEBHOOK_URL = https://script.google.com/macros/s/AKfycbzzburGr5Wix2gLHE726rP6Rppa1I2I8q9QKud3D6thwZSBP8TjjVUNm8qbqGu9YjjKRA/exec;

        // Verifica se já está logado ao carregar a página
        window.addEventListener('DOMContentLoaded', () => {
            const logado = localStorage.getItem('mgc_logado');
            if (logado === 'true') {
                mostrarApp();
            } else {
                mostrarLogin();
            }
        });

        function mostrarLogin() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('hidden');
        }

        function mostrarApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
        }

        async function fazerLogin(event) {
            event.preventDefault();
            const senha = document.getElementById('senha-input').value;
            const btn = document.getElementById('btn-entrar');
            const erroDiv = document.getElementById('login-error');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Verificando...';
            erroDiv.classList.add('hidden');

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'auth', senha: senha })
                });
                const resultado = await response.json();

                if (resultado.autorizado) {
                    // Salva no navegador para nunca mais pedir login neste dispositivo
                    localStorage.setItem('mgc_logado', 'true');
                    mostrarApp();
                } else {
                    erroDiv.classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                alert("Erro ao conectar com o servidor.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Entrar no Sistema</span><i class="fa-solid fa-arrow-right"></i>';
            }
        }

        function fazerLogout() {
            localStorage.removeItem('mgc_logado');
            document.getElementById('senha-input').value = '';
            mostrarLogin();
        }

        async function enviarLancamento(event) {
            event.preventDefault();
            const tipo = document.getElementById('tipo').value;
            const valor = document.getElementById('valor').value;
            const descricao = document.getElementById('descricao').value;
            const btn = document.getElementById('btn-enviar');

            btn.disabled = true;
            btn.innerText = "Salvando...";

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'lancamento',
                        id: 'ID_' + Date.now(),
                        tipo: tipo,
                        data: new Date().toLocaleDateString('pt-BR'),
                        valor: valor,
                        descricao: descricao
                    })
                });
                alert("Lançamento salvo com sucesso!");
                document.getElementById('lancamento-form').reset();
            } catch (err) {
                alert("Erro ao salvar lançamento.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Salvar Lançamento";
            }
        }
    </script>
</body>
</html>
