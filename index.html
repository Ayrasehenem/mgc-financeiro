<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGC Financeiro</title>
    <style>
        :root {
            --bg-color: #fcf9f2;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #b5832a;
            --primary-hover: #9a6e21;
            --border-color: #e2d9cc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Tela de Login */
        #login-screen {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        #login-screen h2 {
            margin-bottom: 20px;
            color: #2c2c2c;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #666;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background-color: var(--primary-hover);
        }

        .error-msg {
            color: #d9534f;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }

        /* Conteúdo Principal (Aparece após logar) */
        #app-screen {
            display: none;
            text-align: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen">
        <h2>🔒 MGC Financeiro</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 25px;">Digite sua senha de acesso para continuar</p>
        
        <div class="input-group">
            <label for="senha">SENHA DE ACESSO</label>
            <input type="password" id="senha" placeholder="Sua senha..." autofocus>
        </div>

        <button class="btn-login" onclick="fazerLogin()">Entrar</button>
        <div id="erro-msg" class="error-msg">Senha incorreta! Tente novamente.</div>
    </div>

    <!-- TELA DO APLICATIVO (Onde ficam os lançamentos) -->
    <div id="app-screen">
        <h1>Bem-vindo ao MGC Financeiro 🚀</h1>
        <p>Painel de lançamentos liberado com sucesso!</p>
        <button onclick="sair()" style="margin-top: 20px; padding: 10px 20px; background: #ccc; border: none; border-radius: 6px; cursor: pointer;">Sair / Bloquear</button>
    </div>

    <script>
        // Defina sua senha aqui
        const SENHA_MESTRE = "MarmoresMgc442220"; 
        
        // Link atualizado do Apps Script que você acabou de gerar
        const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxuvl71RJfR_Lan14U-R2764eJiuX9Ro3E9EiRjg2Zzr_bwFmNz5aOfihOmJ-fj6Lm9rg/exec";

        // Verifica se já estava logado anteriormente no navegador
        window.onload = function() {
            if (localStorage.getItem("mgc_logado") === "true") {
                mostrarApp();
            }
        };

        function fazerLogin() {
            const senhaDigitada = document.getElementById("senha").value;
            const erroMsg = document.getElementById("erro-msg");

            if (senhaDigitada === SENHA_MESTRE) {
                localStorage.setItem("mgc_logado", "true");
                mostrarApp();
            } else {
                erroMsg.style.display = "block";
                document.getElementById("senha").value = "";
                document.getElementById("senha").focus();
            }
        }

        function mostrarApp() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("app-screen").style.display = "block";
        }

        function sair() {
            localStorage.removeItem("mgc_logado");
            location.reload();
        }

        // Permitir apertar "Enter" para logar
        document.getElementById("senha").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                fazerLogin();
            }
        });
    </script>
</body>
</html>
