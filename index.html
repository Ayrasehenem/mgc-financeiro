<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGC - Gestão Financeira</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            color: #333;
        }
        /* Estilos da Tela de Login */
        #tela-login {
            max-width: 350px;
            margin: 100px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        #tela-login h3 {
            margin-bottom: 20px;
            color: #2c3e50;
        }
        #tela-login input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        #tela-login button {
            width: 100%;
            padding: 10px;
            background: #27ae60;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
        }
        #tela-login button:hover {
            background: #219653;
        }
        /* Conteúdo Principal */
        #conteudo-projeto {
            display: none;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .header-app {
            background: #2c3e50;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-nuvem {
            font-size: 14px;
            background: #e67e22;
            padding: 5px 10px;
            border-radius: 4px;
        }
        .card {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <!-- Tela de Login / Senha -->
    <div id="tela-login">
        <h3>🔒 Acesso Restrito</h3>
        <input type="password" id="campo-senha" placeholder="Digite sua senha" autofocus>
        <button onclick="verificarSenha()">Entrar</button>
    </div>

    <!-- Conteúdo do Projeto (Oculto até acertar a senha) -->
    <div id="conteudo-projeto">
        <div class="header-app">
            <h2>MGC - Gestão Financeira</h2>
            <span id="statusNuvem" class="status-nuvem">Conectando à nuvem...</span>
        </div>

        <div class="card">
            <h3>Painel Principal</h3>
            <p>Seu sistema está sincronizado com o Google Sheets.</p>
            <div id="dados-container">Carregando dados da planilha...</div>
        </div>
    </div>

    <script>
        // URL oficial do seu Webhook do Google Apps Script
        const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbwmoaUqC50EwvhliNXUsWs53erGxKzNIgcTj-yNnjWYJCZHZmV0CuZsKnddVdiROWP0YQ/exec';

        // Defina a sua senha de acesso aqui
        const SENHA_MEU_PROJETO = "1234"; // Altere para a senha que preferir

        function verificarSenha() {
            const digitada = document.getElementById("campo-senha").value;

            if (digitada === SENHA_MEU_PROJeton) { // Corrigido para variável correta
            }

            if (digitada === SENHA_MEU_PROJETO) {
                // Esconde login e mostra o app
                document.getElementById("tela-login").style.display = "none";
                document.getElementById("conteudo-projeto").style.display = "block";
                
                // Assim que entra, carrega os dados da nuvem
                carregarDadosDaNuvem();
            } else {
                alert("Senha incorreta!");
                document.getElementById("campo-senha").value = "";
                document.getElementById("campo-senha").focus();
            }
        }

        // Permitir entrar apertando a tecla Enter
        document.getElementById("campo-senha").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                verificarSenha();
            }
        });

        // Função para buscar dados do Google Sheets via Webhook
        async function carregarDadosDaNuvem() {
            const statusEl = document.getElementById("statusNuvem");
            const container = document.getElementById("dados-container");

            try {
                statusEl.innerText = "Sincronizando...";
                statusEl.style.background = "#e67e22";

                const response = await fetch(WEBHOOK_URL);
                const data = await response.json();

                statusEl.innerText = "Conectado à Nuvem ✓";
                statusEl.style.background = "#27ae60";

                // Aqui você pode renderizar os dados que vierem da sua planilha
                container.innerHTML = `<p>Dados carregados com sucesso! Total de registros: ${data.length || 'Online'}</p>`;

            } catch (error) {
                console.error("Erro ao carregar dados:", error);
                statusEl.innerText = "Modo Offline / Erro na Nuvem";
                statusEl.style.background = "#c0392b";
                container.innerHTML = `<p>Não foi possível conectar ao Google Sheets, mas o app está funcional localmente.</p>`;
            }
        }
    </script>
</body>
</html>
