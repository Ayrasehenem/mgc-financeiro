<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGC - Gerenciador Financeiro</title>
    <style>
        :root {
            --bg-color: #fcf8f2;
            --card-bg: #ffffff;
            --text-main: #2c221e;
            --text-muted: #6e6259;
            --primary: #9c4221;
            --primary-hover: #7b3319;
            --border: #e6dfd5;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 20px;
            border: 1px solid var(--border);
            height: fit-content;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .sync-status {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab-btn {
            flex: 1;
            min-width: 100px;
            padding: 10px;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .summary-card {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
        }

        .summary-card h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .summary-card .value {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>MGC</h1>
            <div class="sync-status">Gerenciador Financeiro Pessoal</div>
        </div>

        <div class="tabs">
            <button class="tab-btn active">📑 Despesas</button>
            <button class="tab-btn">🏗️️ Obra</button>
            <button class="tab-btn">⏳ Pendentes</button>
            <button class="tab-btn">🐷 Porquinho</button>
        </div>

        <div class="summary-card">
            <h3>Total de Despesas</h3>
            <div class="value">R$ 0,00</div>
        </div>
    </div>

</body>
</html>
