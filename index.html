<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGC Despesas - Exportador Elegante</title>
    <!-- Tailwind CSS para estilização moderna e responsiva -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- SheetJS (xlsx) para gerar planilhas Excel formatadas -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-indigo-600/30 text-indigo-400 mb-3 border border-indigo-500/30">
                <i class="fa-solid fa-file-excel text-xl"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight">Exportador MGC</h1>
            <p class="text-sm text-slate-400 mt-1">Gere sua planilha com cabeçalho elegante e otimizada para celular e PC.</p>
        </div>

        <!-- Seletor de Tipo de Extração -->
        <div class="mb-4">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Tipo de Extração</label>
            <div class="grid grid-cols-2 gap-3">
                <button type="button" id="btnMensal" onclick="setTipo('Mensal')" class="py-2.5 px-4 text-sm font-medium rounded-xl border border-indigo-500 bg-indigo-600/20 text-indigo-300 transition-all flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-regular fa-calendar"></i> Mensal
                </button>
                <button type="button" id="btnAnual" onclick="setTipo('Anual')" class="py-2.5 px-4 text-sm font-medium rounded-xl border border-slate-700 bg-slate-900/50 text-slate-400 transition-all flex items-center justify-center gap-2 hover:bg-slate-700/50 cursor-pointer">
                    <i class="fa-solid fa-calendar-days"></i> Anual
                </button>
            </div>
        </div>

        <!-- Período / Referência -->
        <div class="mb-6">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Referência (Ex: Outubro/2026 ou 2026)</label>
            <input type="text" id="inputPeriodo" value="2026_10" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-slate-100">
        </div>

        <!-- Botão de Ação -->
        <button onclick="exportarExcel()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium py-3 px-4 rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 cursor-pointer">
            <i class="fa-solid fa-download"></i> Exportar Documento Excel
        </button>
    </div>

    <script>
        let tipoExtracao = 'Mensal';

        function setTipo(tipo) {
            tipoExtracao = tipo;
            const btnM = document.getElementById('btnMensal');
            const btnA = document.getElementById('btnAnual');
            const inputP = document.getElementById('inputPeriodo');

            if (tipo === 'Mensal') {
                btnM.className = "py-2.5 px-4 text-sm font-medium rounded-xl border border-indigo-500 bg-indigo-600/20 text-indigo-300 transition-all flex items-center justify-center gap-2 cursor-pointer";
                btnA.className = "py-2.5 px-4 text-sm font-medium rounded-xl border border-slate-700 bg-slate-900/50 text-slate-400 transition-all flex items-center justify-center gap-2 hover:bg-slate-700/50 cursor-pointer";
                inputP.value = "2026_10";
            } else {
                btnA.className = "py-2.5 px-4 text-sm font-medium rounded-xl border border-indigo-500 bg-indigo-600/20 text-indigo-300 transition-all flex items-center justify-center gap-2 cursor-pointer";
                btnM.className = "py-2.5 px-4 text-sm font-medium rounded-xl border border-slate-700 bg-slate-900/50 text-slate-400 transition-all flex items-center justify-center gap-2 hover:bg-slate-700/50 cursor-pointer";
                inputP.value = "2026";
            }
        }

        function exportarExcel() {
            const periodo = document.getElementById('inputPeriodo').value || '2026';
            const tituloCabecalho = `Financeiro MGC - ${tipoExtracao}`;

            // Dados de Exemplo refinados
            const rawData = [
                { data: "05/10/2026", valor: 30.00, desc: "C6P/ANK Alimentação", cat: "Alimentação", tag: "Pix", obra: "Não", link: "https://drive.google.com/file/d/1Mumex6j_etckEP1FIgrw" },
                { data: "05/10/2026", valor: 366.00, desc: "COBANK Contas", cat: "Alimentação", tag: "Pix", obra: "Não", link: "https://drive.google.com/file/d/1uKmllyJYkBwv7Gcz7ya" },
                { data: "05/10/2026", valor: 30.00, desc: "C6P/ANK Contas", cat: "Alimentação", tag: "Pix", obra: "Não", link: "https://drive.google.com/file/d/1_4ikQ1wE_7UXoTtSxmo" },
                { data: "05/10/2026", valor: 4.00, desc: "teste 5", cat: "Alimentação", tag: "Pix", obra: "Não", link: "Não" },
                { data: "05/10/2026", valor: 3.00, desc: "teste", cat: "Alimentação", tag: "Pix", obra: "Não", link: "Não" }
            ];

            // Criando a matriz do SheetJS para estilização profunda
            const wsData = [];

            // Linha 1: Cabeçalho Principal (Título Elegante Dinâmico: Mensal ou Anual)
            wsData.push([tituloCabecalho, "", "", "", "", "", ""]);
            // Linha 2: Subtítulo com período de referência
            wsData.push([`Referência: ${periodo}`, "", "", "", "", "", ""]);
            // Linha 3: Vazia para respiro visual
            wsData.push(["", "", "", "", "", "", ""]);
            // Linha 4: Cabeçalhos das colunas (Ordem otimizada para celular/PC)
            wsData.push(["Data", "Valor (R$)", "Descrição", "Categoria", "Tag", "Obra", "Comprovante"]);

            // Linhas de Dados com tratamento de links limpos
            rawData.forEach(item => {
                let compCell = item.link !== "Não" ? { t: 's', v: '📄 Ver Anexo', l: { Target: item.link } } : "Não";
                wsData.push([
                    item.data,
                    item.valor,
                    item.desc,
                    item.cat,
                    item.tag,
                    item.obra,
                    compCell
                ]);
            });

            const ws = XLSX.utils.aoa_to_sheet(wsData);

            // Mesclar o título principal nas primeiras colunas
            if(!ws['!merges']) ws['!merges'] = [];
            ws['!merges'].push({ s: { r: 0, c: 0 }, e: { r: 0, c: 6 } });
            ws['!merges'].push({ s: { r: 1, c: 0 }, e: { r: 1, c: 6 } });

            // Estilização Avançada usando propriedades do SheetJS
            const range = XLSX.utils.decode_range(ws['!ref']);
            
            for (let R = range.s.r; R <= range.e.r; ++R) {
                for (let C = range.s.c; C <= range.e.c; ++C) {
                    const cellAddress = { c: C, r: R };
                    const cellRef = XLSX.utils.encode_cell(cellAddress);
                    if (!ws[cellRef]) continue;

                    // Inicializar estilo se não existir
                    if (!ws[cellRef].s) ws[cellRef].s = {};

                    // 1. Estilo do Título Principal (Linha 0)
                    if (R === 0) {
                        ws[cellRef].s = {
                            font: { name: "Segoe UI", sz: 14, bold: true, color: { rgb: "FFFFFF" } },
                            fill: { fgColor: { rgb: "312E81" } }, // Índigo escuro elegante
                            alignment: { horizontal: "center", vertical: "center" }
                        };
                    }
                    // 2. Estilo do Subtítulo (Linha 1)
                    else if (R === 1) {
                        ws[cellRef].s = {
                            font: { name: "Segoe UI", sz: 10, italic: true, color: { rgb: "CBD5E1" } },
                            fill: { fgColor: { rgb: "312E81" } },
                            alignment: { horizontal: "center", vertical: "center" }
                        };
                    }
                    // 3. Estilo do Cabeçalho da Tabela (Linha 3)
                    else if (R === 3) {
                        ws[cellRef].s = {
                            font: { name: "Segoe UI", sz: 11, bold: true, color: { rgb: "FFFFFF" } },
                            fill: { fgColor: { rgb: "4338CA" } }, // Tom índigo mais vibrante
                            alignment: { horizontal: C === 1 ? "right" : (C === 0 || C === 5 ? "center" : "left"), vertical: "center" },
                            border: {
                                bottom: { style: "medium", color: { rgb: "312E81" } }
                            }
                        };
                    }
                    // 4. Estilo das Linhas de Dados (R > 3)
                    else if (R > 3) {
                        const isEven = (R % 2 === 0);
                        const bgColor = isEven ? "F8FAFC" : "FFFFFF"; // Efeito Zebrado suave para celular

                        let align = "left";
                        if (C === 0 || C === 5 || C === 6) align = "center"; // Data, Obra, Comprovante
                        if (C === 1) align = "right"; // Valor monetário

                        ws[cellRef].s = {
                            font: { name: "Segoe UI", sz: 10, color: { rgb: "1E293B" } },
                            fill: { fgColor: { rgb: bgColor } },
                            alignment: { horizontal: align, vertical: "center" },
                            border: {
                                bottom: { style: "thin", color: { rgb: "E2E8F0" } },
                                right: { style: "thin", color: { rgb: "F1F5F9" } }
                            }
                        };

                        // Formatação de Valores Monetários
                        if (C === 1 && typeof ws[cellRef].v === 'number') {
                            ws[cellRef].z = '"R$ "#,##0.00';
                        }

                        // Estilo visual de link limpo para os comprovantes
                        if (C === 6 && ws[cellRef].v !== "Não") {
                            ws[cellRef].s.font = { name: "Segoe UI", sz: 10, color: { rgb: "2563EB" }, underline: true };
                        }
                    }
                }
            }

            // Altura das linhas personalizada
            ws['!rows'] = [
                { hpt: 30 }, // Título
                { hpt: 20 }, // Subtítulo
                { hpt: 10 }, // Espaçador
                { hpt: 24 }, // Cabeçalho da tabela
                { hpt: 20 }, { hpt: 20 }, { hpt: 20 }, { hpt: 20 }, { hpt: 20 }
            ];

            // Largura inteligente das colunas para melhor leitura no celular e PC
            ws['!cols'] = [
                { wch: 12 }, // Data
                { wch: 15 }, // Valor
                { wch: 25 }, // Descrição
                { wch: 15 }, // Categoria
                { wch: 12 }, // Tag
                { wch: 10 }, // Obra
                { wch: 18 }  // Comprovante
            ];

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Despesas");

            // Gerar e baixar arquivo
            const nomeArquivo = `MGC_Despesas_${periodo}.xlsx`;
            XLSX.writeFile(wb, nomeArquivo);
        }
    </script>
</body>
</html>
