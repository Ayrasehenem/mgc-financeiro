<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGC - Gerenciador Financeiro</title>
    <style>
        :root {
            --bg-color: #fcf8f2;
            --card-bg: #ffffff;
            --text-main: #2c221e;
            --text-muted: #6e6259;
            --primary: #9c4221;
            --primary-hover: #7b3319;
            --border: #e6dfd5;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 20px;
            border: 1px solid var(--border);
            height: fit-content;
            position: relative;
            padding-bottom: 80px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab-btn {
            flex: 1;
            min-width: 90px;
            padding: 10px;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .summary-card {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .summary-card h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .summary-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .lancamentos-header {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .lancamento-item {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .lancamento-info h4 {
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .lancamento-info span {
            font-size: 0.75rem;
            background: var(--primary);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .lancamento-valor {
            font-weight: 700;
            font-size: 1rem;
        }

        .fab {
            position: fixed;
            bottom: 24px;
            right: calc(50% - 280px);
            background: var(--primary);
            color: white;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 10;
        }

        /* Estilos do Modal de Cadastro */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--radius);
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--border);
        }

        .modal-content h3 {
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            background: var(--bg-color);
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-cancel {
            background: var(--bg-color);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .btn-save {
            background: var(--primary);
            color: white;
        }

        @media (max-width: 640px) {
            .fab { right: 24px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>MGC</h1>
            <div style="font-size: 0.85rem; color: var(--text-muted);">Gerenciador Financeiro Pessoal</div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="mudarAba('despesas')">📑 Despesas</button>
            <button class="tab-btn" onclick="mudarAba('obra')">🏗 Obra</button>
            <button class="tab-btn" onclick="mudarAba('pendentes')">⏳ Pendentes</button>
            <button class="tab-btn" onclick="mudarAba('porquinho')">🐷 Porquinho</button>
        </div>

        <div class="summary-card">
            <h3 id="titulo-total">Total de Despesas</h3>
            <div class="value" id="valor-total">R$ 10,00</div>
        </div>

        <div class="lancamentos-header">Lançamentos</div>
        
        <div id="lista-lancamentos">
            <div class="lancamento-item">
                <div class="lancamento-info">
                    <h4>teste 04-10</h4>
                    <span>Outros</span>
                </div>
                <div class="lancamento-valor">R$ 10,00</div>
            </div>
        </div>

        <button class="fab" onclick="abrirModal()">+</button>
    </div>

    <!-- Modal para Novo Lançamento -->
    <div class="modal" id="modal-lancamento">
        <div class="modal-content">
            <h3>Novo Lançamento</h3>
            <div class="form-group">
                <label>Descrição</label>
                <input type="text" id="desc-input" placeholder="Ex: Supermercado">
            </div>
            <div class="form-group">
                <label>Valor (R$)</label>
                <input type="number" id="valor-input" step="0.01" placeholder="0,00">
            </div>
            <div class="form-group">
                <label>Categoria</label>
                <select id="cat-input">
                    <option value="Outros">Outros</option>
                    <option value="Alimentação">Alimentação</option>
                    <option value="Casa">Casa</option>
                    <option value="Transporte">Transporte</option>
                </select>
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                <button class="btn-save" onclick="salvarLancamento()">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        let dados = [
            { descricao: 'teste 04-10', valor: 10.00, categoria: 'Outros' }
        ];

        function mudarAba(aba) {
            const botoes = document.querySelectorAll('.tab-btn');
            botoes.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            const tituloTotal = document.getElementById('titulo-total');
            if(aba === 'obra') tituloTotal.innerText = 'Total de Gastos com Obra';
            else if(aba === 'pendentes') tituloTotal.innerText = 'Total Pendente';
            else if(aba === 'porquinho') tituloTotal.innerText = 'Total Guardado';
            else tituloTotal.innerText = 'Total de Despesas';
        }

        function abrirModal() {
            document.getElementById('modal-lancamento').classList.add('active');
        }

        function fecharModal() {
            document.getElementById('modal-lancamento').classList.remove('active');
        }

        function salvarLancamento() {
            const desc = document.getElementById('desc-input').value;
            const valor = parseFloat(document.getElementById('valor-input').value);
            const cat = document.getElementById('cat-input').value;

            if(!desc || isNaN(valor)) {
                alert('Preencha a descrição e o valor corretamente!');
                return;
            }

            dados.push({ descricao: desc, valor: valor, categoria: cat });
            
            atualizarTela();
            fecharModal();

            // Limpa os campos
            document.getElementById('desc-input').value = '';
            document.getElementById('valor-input').value = '';
        }

        function atualizarTela() {
            const lista = document.getElementById('lista-lancamentos');
            lista.innerHTML = '';
            let total = 0;

            dados.forEach(item => {
                total += item.valor;
                lista.innerHTML += `
                    <div class="lancamento-item">
                        <div class="lancamento-info">
                            <h4>${item.descricao}</h4>
                            <span>${item.categoria}</span>
                        </div>
                        <div class="lancamento-valor">R$ ${item.valor.toFixed(2).replace('.', ',')}</div>
                    </div>
                `;
            });

            document.getElementById('valor-total').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }
    </script>
</body>
</html>
